<header class="terminal-header">
  <a class="terminal-brand" href="/" aria-label="Corey Weathers, home">Corey Weathers</a>
  <nav id="terminal-menu" aria-label="Primary navigation">
    {{- range .Site.Menus.main }}
      {{- $url := .URL | relLangURL -}}
      <a href="{{ $url }}"{{ if or ($.IsMenuCurrent "main" .) (eq $.RelPermalink $url) }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
  <div class="terminal-header-actions">
    <button class="study-theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
      <span class="study-theme-toggle__light" aria-hidden="true">☼</span>
      <span class="study-theme-toggle__dark" aria-hidden="true">◐</span>
      <span class="sr-only study-theme-toggle__label">Switch color theme</span>
    </button>
    <a class="terminal-header-cta" href="/contact/">Work with me</a>
    <button class="terminal-menu-toggle" type="button" aria-expanded="false" aria-controls="terminal-menu"><span></span><span></span><span></span><b class="sr-only">Menu</b></button>
  </div>
</header>
