<script>document.documentElement.classList.add('js')</script>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="terminal-header">
  <a class="terminal-brand" href="/" aria-label="Corey L Weathers, home">Corey L Weathers</a>
  <nav id="terminal-menu" aria-label="Primary navigation">
    {{ range hugo.Data.site.navigation.primary }}{{ $active := eq $.RelPermalink .url }}{{ if and (eq .label "Read") (eq $.Section "posts") }}{{ $active = true }}{{ end }}<a href="{{ .url }}"{{ if $active }} class="active" aria-current="page"{{ end }}>{{ .label }}</a>{{ end }}
  </nav>
  <div class="terminal-header-actions">
    <a class="terminal-now-link" href="/now/">Now</a>
    <button class="study-theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme"><span class="theme-light" aria-hidden="true">☼</span><span class="theme-dark" aria-hidden="true">◐</span></button>
    <a class="terminal-header-cta" href="/work-with-me/">Work with me</a>
    <button class="terminal-menu-toggle" type="button" aria-label="Toggle primary navigation" aria-expanded="false" aria-controls="terminal-menu"><span></span><span></span><span></span></button>
  </div>
</header>
