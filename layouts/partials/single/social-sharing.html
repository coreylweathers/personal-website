{{- $title := .Title | urlquery -}}
{{- $url := .Permalink -}}
<section class="study-sharing" aria-label="Share this essay">
  <p class="study-label">Pass it along</p>
  <div class="study-sharing__actions">
    <button class="study-share-button" type="button" onclick="window.open('https://twitter.com/intent/tweet?text={{ $title }}&url={{ $url | urlquery }}&via=coreylweathers','_blank','noopener,noreferrer')">Share on X ↗</button>
    <button class="study-share-button" type="button" onclick="window.open('https://www.linkedin.com/sharing/share-offsite/?url={{ $url | urlquery }}','_blank','noopener,noreferrer')">LinkedIn ↗</button>
    <button class="study-share-button" type="button" data-copy-url="{{ $url }}" onclick="navigator.clipboard.writeText(this.dataset.copyUrl).then(() => this.textContent='Copied')">Copy link</button>
  </div>
</section>
