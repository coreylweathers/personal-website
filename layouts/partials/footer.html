<footer class="site-footer">
  <div><a class="site-brand" href="/">Corey L Weathers</a><p>{{ hugo.Data.site.identity.statement }}</p></div>
  <nav aria-label="Footer navigation">{{ range hugo.Data.site.navigation.primary }}<a href="{{ .url }}">{{ .label }}</a>{{ end }}<a href="/contact/">Contact</a></nav>
  <nav aria-label="Social links">{{ range hugo.Data.site.social }}<a href="{{ .url }}"{{ if hasPrefix .url "http" }} rel="me noopener"{{ end }}>{{ .label }}</a>{{ end }}</nav>
  <p class="copyright">© {{ now.Year }} Corey L Weathers</p>
</footer>
