<div class="contact-form-shell">
  <form class="contact-form study-form" method="post" action="https://forms.un-static.com/forms/{{ .Site.Params.contact_form_id }}">
    <p class="study-label">Direct message</p>
    <h2 class="study-subheading">Send me a note</h2>

    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" name="name" class="form-control" autocomplete="name" type="text" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input id="email" name="email" class="form-control" autocomplete="email" type="email" required>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" class="form-control" placeholder="What are you working through?" required></textarea>
    </div>

    <button name="submit" type="submit" class="btn-submit">Send Message</button>

  </form>
</div>
